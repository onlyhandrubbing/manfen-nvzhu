name: 同步賣貨便庫存

on:
  schedule:
    - cron: "17 */3 * * *"   # 每 3 小時檢查一次
  workflow_dispatch:          # 管理頁的「立即檢查」按鈕

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node sync.mjs
      - name: 有變動才存回
        run: |
          git config user.name "sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          git diff --cached --quiet || (git commit -m "同步賣貨便庫存" && git pull --rebase && git push)
